<app-header></app-header>
<!-- Main Content (Center) -->
<main class="flex-grow flex flex-col items-center justify-center px-4 py-8">
  <!-- Logo -->
  <div class="mb-8 flex justify-center">
    <img src="wordmark.png" alt="Subhrodip" class="h-24 object-contain select-none">
  </div>
  <!-- Search Bar -->
  <div class="w-full max-w-[584px] relative group" (click)="onSearch()">
    <div class="flex items-center w-full h-[44px] border border-surface-variant rounded-full px-4 search-bar-shadow bg-surface-container-lowest transition-shadow duration-200 cursor-pointer">
      <span class="material-symbols-outlined text-outline mr-3">search</span>
      <input class="flex-grow bg-transparent border-none focus:ring-0 font-search-input text-search-input text-on-surface outline-none placeholder-outline cursor-pointer" placeholder="Search..." type="text" [value]="currentText()" readonly/>
      <div class="flex space-x-3 items-center">
        <span class="material-symbols-outlined text-primary cursor-pointer hover:opacity-80" data-weight="fill" style="font-variation-settings: 'FILL' 1;">mic</span>
        <span class="material-symbols-outlined text-secondary cursor-pointer hover:opacity-80">center_focus_strong</span>
      </div>
    </div>
  </div>
  <!-- Action Buttons -->
  <div class="flex space-x-3 mt-8">
    <button (click)="onSearch()" class="bg-surface-container-low text-on-surface font-body-snippet text-sm px-4 py-2 rounded border border-transparent hover:border-surface-variant hover:shadow-sm focus:outline-none focus:ring-1 focus:ring-primary transition-all">
      Search Portfolio
    </button>
    <button class="bg-surface-container-low text-on-surface font-body-snippet text-sm px-4 py-2 rounded border border-transparent hover:border-surface-variant hover:shadow-sm focus:outline-none focus:ring-1 focus:ring-primary transition-all">
      I'm Feeling Curious
    </button>
  </div>
  <div class="mt-6 text-sm text-on-surface-variant font-body-snippet text-center">
    Talk is cheap, <a class="text-primary hover:underline" href="#">show me the code!</a>
  </div>
</main>
<app-footer></app-footer>
