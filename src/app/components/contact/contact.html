<!-- Main Layout -->
<div class="flex-grow flex w-full md:px-0 py-4 gap-16 font-body-snippet min-h-[80vh]">
  <!-- Left Column: Search Results -->
  <main class="w-full md:w-[652px] md:ml-[180px] flex flex-col px-4 md:px-0">
    <div class="text-outline text-[14px] mb-6">
      {{c().contact.metrics}}
    </div>

    <!-- Result 1 - Contact Form -->
    <div class="mb-[28px] group">
      <div class="flex items-center gap-3 mb-1">
        <div class="w-7 h-7 rounded-full bg-surface-container-low flex items-center justify-center border border-surface-variant overflow-hidden">
          <span class="material-symbols-outlined text-on-surface-variant text-[16px]">contact_mail</span>
        </div>
        <div class="flex flex-col">
          <span class="text-[14px] text-on-surface leading-tight">{{c().common.name}}</span>
          <a class="flex items-center gap-1 text-[12px] text-on-surface-variant leading-tight hover:underline" routerLink="/">
            <span>{{c().contact.breadcrumb}}</span>
          </a>
        </div>
      </div>
      <a class="inline-block group mb-1" href="mailto:hi@subhrodip.com">
        <h3 class="text-[20px] text-primary-container group-hover:underline font-normal leading-[1.3] font-result-title">{{c().contact.title}}</h3>
      </a>
      
      <!-- Contact Form -->
      <div class="mt-4 max-w-[600px] border border-surface-variant rounded-[8px] p-4 bg-surface-bright">
        <form action="https://formspree.io/mwklgobo" method="POST" target="_blank" class="flex flex-col gap-4">
          <div class="flex flex-col">
            <label for="name" class="text-[13px] text-on-surface font-medium mb-1">{{c().contact.form.name}} <span class="text-error">*</span></label>
            <input type="text" id="name" name="name" required class="h-[36px] px-3 rounded-[4px] border border-surface-variant focus:outline-none focus:border-primary text-[14px]">
          </div>
          <div class="flex flex-col">
            <label for="email" class="text-[13px] text-on-surface font-medium mb-1">{{c().contact.form.email}} <span class="text-error">*</span></label>
            <input type="email" id="email" name="email" required class="h-[36px] px-3 rounded-[4px] border border-surface-variant focus:outline-none focus:border-primary text-[14px]">
          </div>
          <div class="flex flex-col">
            <label for="phone" class="text-[13px] text-on-surface font-medium mb-1">{{c().contact.form.phone}} <span class="text-error">*</span></label>
            <input type="tel" id="phone" name="phone" required class="h-[36px] px-3 rounded-[4px] border border-surface-variant focus:outline-none focus:border-primary text-[14px]">
          </div>
          <div class="flex flex-col">
            <label for="message" class="text-[13px] text-on-surface font-medium mb-1">{{c().contact.form.message}} <span class="text-error">*</span></label>
            <textarea id="message" name="message" required rows="4" class="p-3 rounded-[4px] border border-surface-variant focus:outline-none focus:border-primary text-[14px] resize-y"></textarea>
          </div>
          <div class="mt-2">
            <button type="submit" class="bg-primary hover:bg-primary hover:brightness-90 text-white px-6 py-2 rounded-[4px] text-[14px] font-medium transition-colors shadow-sm w-auto inline-block">
              {{c().contact.form.submit}}
            </button>
          </div>
        </form>
      </div>
    </div>
  </main>

  <!-- Right Column: Knowledge Panel -->
  <aside class="hidden xl:block w-[369px] flex-shrink-0 pr-8">
    <div class="border border-surface-variant rounded-[16px] overflow-hidden bg-white mb-8">
      <div class="flex h-[150px] overflow-hidden bg-surface-bright border-b border-surface-variant">
        <div class="w-full h-full bg-secondary-container/20 flex items-center justify-center">
          <span class="material-symbols-outlined text-secondary text-[80px]">connect_without_contact</span>
        </div>
      </div>
      <div class="p-4">
        <h2 class="text-[32px] font-normal leading-tight text-on-surface mb-1 font-result-title">{{c().contact.knowledgePanel.title}}</h2>
        <p class="text-[16px] text-on-surface-variant">{{c().contact.knowledgePanel.subtitle}}</p>
      </div>
      <div class="px-4 py-4 border-t border-surface-variant">
        <div class="space-y-3">
          <a href="mailto:hi@subhrodip.com" class="flex items-center gap-3 text-[14px] text-primary-container hover:underline">
            <span class="material-symbols-outlined text-outline text-[20px]">mail</span>
            hi@subhrodip.com
          </a>
          <a href="https://github.com/ohbus" target="_blank" class="flex items-center gap-3 text-[14px] text-primary-container hover:underline">
            <span class="material-symbols-outlined text-outline text-[20px]">code</span>
            github.com/ohbus
          </a>
          <a href="https://www.linkedin.com/in/ohbusm/" target="_blank" class="flex items-center gap-3 text-[14px] text-primary-container hover:underline">
            <span class="material-symbols-outlined text-outline text-[20px]">work</span>
            linkedin.com/in/ohbusm
          </a>
        </div>
      </div>
    </div>
  </aside>
</div>
