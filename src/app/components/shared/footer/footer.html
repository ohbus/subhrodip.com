<!-- Footer -->
<footer class="bg-surface-container-low text-on-surface-variant font-url-breadcrumb text-url-breadcrumb w-full flex flex-col border-t border-surface-variant mt-auto">
  <div class="px-8 pt-3 pb-3 border-b border-surface-variant flex items-center gap-2">
    <app-language-picker #picker>
      <button (click)="picker.toggle()" class="hover:underline flex items-center gap-1.5 focus:outline-none group py-1.5">
        <span class="material-symbols-outlined text-[18px] text-outline group-hover:text-primary transition-colors leading-none">language</span>
        <span class="text-outline leading-none">{{c().footer.location}}</span>
        <span class="text-[12px] text-outline opacity-70 flex items-center leading-none translate-y-[0.5px]">({{currentLang() === 'en' ? 'English' : currentLang() === 'bn' ? 'বাংলা' : 'Deutsch'}})</span>
      </button>
    </app-language-picker>
  </div>
  <div class="px-8 pt-3 pb-5 flex flex-wrap justify-between items-center w-full space-y-2 sm:space-y-0 text-sm">
    <div class="flex space-x-4 md:space-x-6">
      <a class="hover:underline cursor-pointer" routerLink="/sde">{{c().navigation.sde}}</a>
      <a class="hidden sm:block hover:underline cursor-pointer" routerLink="/cde">{{c().navigation.cde}}</a>
      <a class="hidden md:block hover:underline cursor-pointer" routerLink="/education">{{c().navigation.education}}</a>
    </div>
    <div class="flex space-x-4 md:space-x-6">
      <a class="hover:underline cursor-pointer" href="https://linkedin.com/in/ohbusm" target="_blank">{{c().footer.privacy}}</a>
      <a class="hidden xs:block hover:underline cursor-pointer" href="https://linkedin.com/in/ohbusm" target="_blank">{{c().footer.terms}}</a>
      <a class="hover:underline cursor-pointer" routerLink="/contact">{{c().footer.contact}}</a>
    </div>
  </div>
</footer>
