<app-feature-layout 
  [metrics]="c().cde.metrics"
  [knowledgePanelConfig]="knowledgePanelConfig"
  [relatedSearches]="c().cde.related">

  <!-- Result 1 - Spring Cloud AWS -->
  <app-search-result-item 
    icon="code" 
    logoUrl="https://www.google.com/s2/favicons?sz=128&domain=github.com"
    [label]="c().cde.projects.label"
    [breadcrumb]="c().cde.projects.aws.breadcrumb"
    url="https://github.com/awspring/spring-cloud-aws"
    [title]="c().cde.projects.aws.title"
    [snippet]="c().cde.projects.aws.snippet">
  </app-search-result-item>

  <!-- Result 2 - sclr.ac Backend -->
  <app-search-result-item 
    icon="code" 
    logoUrl="https://www.google.com/s2/favicons?sz=128&domain=github.com"
    [label]="c().cde.projects.label"
    [breadcrumb]="c().cde.projects.sclr.breadcrumb"
    url="https://github.com/scaleracademy/sclr.ac-backend"
    [title]="c().cde.projects.sclr.title"
    [snippet]="c().cde.projects.sclr.snippet">
  </app-search-result-item>

  <!-- Result 3 - Lunch Booking -->
  <app-search-result-item 
    icon="code" 
    logoUrl="https://www.google.com/s2/favicons?sz=128&domain=github.com"
    [label]="c().cde.projects.label"
    [breadcrumb]="c().cde.projects.lunch.breadcrumb"
    url="https://github.com/ohbus/lunch-booking-backend"
    [title]="c().cde.projects.lunch.title"
    [snippet]="c().cde.projects.lunch.snippet">
  </app-search-result-item>

</app-feature-layout>
