<!-- Main Layout -->
<div class="flex-grow flex w-full md:px-0 py-4 gap-16 font-body-snippet min-h-[80vh]">
  <!-- Left Column: Search Results -->
  <main class="w-full md:w-content-width md:ml-container-left-margin flex flex-col px-4 md:px-0">
    <app-search-metrics [metrics]="c().sde.metrics" />

    <!-- Result 2 - Project 1 -->
    <app-search-result-item 
      icon="code" 
      logoUrl="https://www.google.com/s2/favicons?sz=128&domain=github.com"
      [label]="c().sde.projects.label"
      [breadcrumb]="c().sde.projects.patterns.breadcrumb"
      url="https://github.com/iluwatar/java-design-patterns"
      [title]="c().sde.projects.patterns.title"
      [snippet]="c().sde.projects.patterns.snippet">
      <div footer class="flex items-center gap-4 text-sm text-outline mt-3">
        <div class="flex items-center gap-1.5"><div class="w-3 h-3 rounded-full bg-brand-java"></div> Java</div>
        <div class="flex items-center gap-1.5"><span class="material-symbols-outlined text-sm leading-none">star</span> Pinned</div>
      </div>
    </app-search-result-item>

    <!-- Result 3 - Project 2 -->
    <app-search-result-item 
      icon="account_balance" 
      logoUrl="https://www.google.com/s2/favicons?sz=128&domain=github.com"
      [label]="c().sde.projects.label"
      [breadcrumb]="c().sde.projects.banking.breadcrumb"
      url="https://github.com/ohbus/retail-banking"
      [title]="c().sde.projects.banking.title"
      [snippet]="c().sde.projects.banking.snippet">
      <div footer class="flex items-center gap-4 text-sm text-outline mt-3">
        <div class="flex items-center gap-1.5"><div class="w-3 h-3 rounded-full bg-brand-java"></div> Java</div>
        <div class="flex items-center gap-1.5"><span class="material-symbols-outlined text-sm leading-none">star</span> Pinned</div>
      </div>
    </app-search-result-item>

    <!-- Result 4 - Project 3 -->
    <app-search-result-item 
      icon="forum" 
      logoUrl="https://www.google.com/s2/favicons?sz=128&domain=github.com"
      [label]="c().sde.projects.label"
      [breadcrumb]="c().sde.projects.twitter.breadcrumb"
      url="https://github.com/scaleracademy/twitter-backend-java"
      [title]="c().sde.projects.twitter.title"
      [snippet]="c().sde.projects.twitter.snippet">
      <div footer class="flex items-center gap-4 text-sm text-outline mt-3">
        <div class="flex items-center gap-1.5"><div class="w-3 h-3 rounded-full bg-brand-java"></div> Java</div>
        <div class="flex items-center gap-1.5"><span class="material-symbols-outlined text-sm leading-none">star</span> Pinned</div>
      </div>
    </app-search-result-item>

    <app-related-searches 
      [title]="c().sde.related.title" 
      [items]="c().sde.related.items" />
  </main>

  <!-- Right Column: Knowledge Panel -->
  <app-knowledge-panel [config]="knowledgePanelConfig" />
</div>
