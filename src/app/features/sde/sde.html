<app-feature-layout 
  [metrics]="c().sde.metrics"
  [knowledgePanelConfig]="knowledgePanelConfig"
  [relatedSearches]="c().sde.related">

  <!-- Result 1 - Java Design Patterns -->
  <app-search-result-item 
    icon="code" 
    logoUrl="https://www.google.com/s2/favicons?sz=128&domain=github.com"
    [label]="c().sde.projects.label"
    [breadcrumb]="c().sde.projects.patterns.breadcrumb"
    url="https://github.com/iluwatar/java-design-patterns"
    [title]="c().sde.projects.patterns.title"
    [snippet]="c().sde.projects.patterns.snippet">
  </app-search-result-item>

  <!-- Result 2 - Retail Banking -->
  <app-search-result-item 
    icon="code" 
    logoUrl="https://www.google.com/s2/favicons?sz=128&domain=github.com"
    [label]="c().sde.projects.label"
    [breadcrumb]="c().sde.projects.banking.breadcrumb"
    url="https://github.com/ohbus/retail-banking"
    [title]="c().sde.projects.banking.title"
    [snippet]="c().sde.projects.banking.snippet">
  </app-search-result-item>

  <!-- Result 3 - Twitter Backend -->
  <app-search-result-item 
    icon="code" 
    logoUrl="https://www.google.com/s2/favicons?sz=128&domain=github.com"
    [label]="c().sde.projects.label"
    [breadcrumb]="c().sde.projects.twitter.breadcrumb"
    url="https://github.com/scaleracademy/twitter-backend-java"
    [title]="c().sde.projects.twitter.title"
    [snippet]="c().sde.projects.twitter.snippet">
  </app-search-result-item>

</app-feature-layout>
