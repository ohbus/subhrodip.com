<!-- Main Layout -->
<div class="flex-grow flex w-full md:px-0 py-4 gap-16 font-body-snippet min-h-[80vh]">
  <!-- Left Column: Search Results -->
  <main class="w-full md:w-content-width md:ml-container-left-margin flex flex-col px-4 md:px-0">
    <app-search-metrics [metrics]="c().experience.metrics" />

    <!-- Experience Items -->
    @for (item of c().experience.items; track item.company) {
      <app-search-result-item 
        icon="business_center"
        [logoUrl]="item.logoUrl"
        [label]="item.company + ' • ' + item.location"
        [breadcrumb]="item.breadcrumb"
        [url]="item.companyUrl"
        [title]="item.role + ' | ' + item.company">
        <p class="font-medium text-on-surface mb-2">{{item.duration}}</p>
        <ul class="list-disc pl-5 space-y-1">
          @for (highlight of item.highlights; track highlight) {
            <li>{{highlight}}</li>
          }
        </ul>
      </app-search-result-item>
    }

    <app-related-searches 
      [title]="c().experience.related.title" 
      [items]="c().experience.related.items" />
  </main>

  <!-- Right Column: Knowledge Panel -->
  <app-knowledge-panel [config]="knowledgePanelConfig" />
</div>
