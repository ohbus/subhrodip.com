name: Feature request
description: Propose a user-visible improvement
labels:
  - enhancement
body:
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: What should the user be able to do?
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: Describe the smallest useful implementation and what is out of scope.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: List observable outcomes and verification steps.
    validations:
      required: true
  - type: input
    id: openspec
    attributes:
      label: OpenSpec change
      placeholder: openspec/changes/...
