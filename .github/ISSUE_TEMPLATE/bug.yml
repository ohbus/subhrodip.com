name: Bug report
description: Report a reproducible problem
labels:
  - bug
body:
  - type: textarea
    id: behavior
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: Browser, device, commit, or deployment URL
  - type: textarea
    id: verification
    attributes:
      label: Verification
      description: Include a test, browser check, or production command that demonstrates the fix.
