name: Deploy Angular App to GitHub Pages

on:
  push:
    branches:
      - master
  workflow_dispatch:
    inputs:
      ref:
        description: 'Commit, tag, or branch to deploy (use a known-good ref to roll back)'
        required: false
        default: master

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read

# Allow only one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Run tests
        run: npm run test:coverage

      - name: Prepare production artifact
        run: npm run prepare:production

      - name: Verify production artifact
        run: npm run verify:production

      - name: Smoke test production artifact
        run: npm run smoke:production

      - name: Attest Pages artifact
        uses: actions/attest@v4
        with:
          subject-path: '${{ github.workspace }}/dist/subhrodip.com/browser/**'

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: 'dist/subhrodip.com/browser'

  deploy:
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
