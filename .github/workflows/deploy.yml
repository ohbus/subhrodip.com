name: Deploy Angular App to GitHub Pages

on:
  push:
    branches:
      - master
  workflow_dispatch:
    inputs:
      ref:
        description: 'Commit, tag, or branch to deploy (use a known-good ref to roll back)'
        required: false
        default: master

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read

# Allow only one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  coordination:
    name: Master coordination
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout coordination utilities
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: Run parser self-tests
        run: |
          node tools/check-issue-reference.mjs --self-test
          node tools/check-master-reference.mjs --self-test

      - name: Require issue or associated PR
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node tools/check-master-reference.mjs --event "$GITHUB_EVENT_PATH"

  build:
    needs: coordination
    if: ${{ always() && (needs.coordination.result == 'success' || needs.coordination.result == 'skipped') }}
    outputs:
      deployed_sha: ${{ steps.metadata.outputs.sha }}
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Capture deployed commit
        id: metadata
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=low

      - name: Build project
        run: npm run build

      - name: Run tests
        shell: bash
        run: |
          set -o pipefail
          mkdir -p test-results
          npm run test:coverage 2>&1 | tee test-results/test-output.txt

      - name: Publish test results
        if: always()
        shell: bash
        run: |
          {
            echo '## Test results'
            echo '```text'
            if [ -f test-results/test-output.txt ]; then
              tail -n 60 test-results/test-output.txt
            else
              echo 'The test command did not produce output.'
            fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Prepare production artifact
        run: npm run prepare:production

      - name: Verify production artifact
        run: npm run verify:production

      - name: Smoke test production artifact
        run: npm run smoke:production

      - name: Attest Pages artifact
        uses: actions/attest@v4
        with:
          subject-path: '${{ github.workspace }}/dist/subhrodip.com/browser/**'

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: 'dist/subhrodip.com/browser'

  deploy:
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    if: ${{ always() && needs.build.result == 'success' }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

      - name: Report deployed commit and associated PR
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOYED_SHA: ${{ needs.build.outputs.deployed_sha }}
        run: |
          prs="$(gh api \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "repos/${GITHUB_REPOSITORY}/commits/${DEPLOYED_SHA}/pulls" \
            --jq 'if length == 0 then "None" else map("#" + (.number|tostring) + " — " + .title)|join(", ") end')"
          {
            echo '## Deployment coordination'
            echo "- Commit: \`${DEPLOYED_SHA}\`"
            echo "- Associated PR(s): ${prs}"
          } >> "$GITHUB_STEP_SUMMARY"
