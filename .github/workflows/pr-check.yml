name: PR Check

on:
  pull_request:
    branches:
      - master
    types: [opened, edited, reopened, synchronize, ready_for_review]

# Explicitly set minimal permissions for security
permissions:
  contents: read

jobs:
  coordination:
    name: PR coordination
    runs-on: ubuntu-latest
    steps:
      # Use only the trusted base branch for this gate; fork code is never executed here.
      - name: Checkout coordination utilities
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}

      - name: Run parser self-test
        run: node tools/check-issue-reference.mjs --self-test

      - name: Require linked issue
        run: node tools/check-issue-reference.mjs --event "$GITHUB_EVENT_PATH"

  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm run audit:full

      - name: Build project
        run: npm run build

      - name: Run tests
        shell: bash
        run: |
          set -o pipefail
          mkdir -p test-results
          npm run test:coverage 2>&1 | tee test-results/test-output.txt

      - name: Publish test results
        if: always()
        shell: bash
        run: |
          {
            echo '## Test results'
            echo '```text'
            if [ -f test-results/test-output.txt ]; then
              tail -n 60 test-results/test-output.txt
            else
              echo 'The test command did not produce output.'
            fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Prepare production artifact
        run: npm run prepare:production

      - name: Verify production artifact
        run: npm run verify:production

      - name: Smoke test production artifact
        run: npm run smoke:production
