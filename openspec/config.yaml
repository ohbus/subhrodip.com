schema: spec-driven

context: |
  Language: en
  All artifacts must be written in en.
  Keep OpenSpec structural headings and SHALL/MUST keywords in English.
  This repository is an Angular 21.2 standalone-component portfolio using Tailwind CSS.
  Application code is under src/app, static assets are under public, and production
  verification scripts are under tools.
  GitHub Issues are the canonical work tracker. Every active change must include a
  Tracking issue: #N reference and remain aligned with its issue acceptance criteria.
  Keep existing PR verification and GitHub Pages deployment behavior intact.

# Per-artifact rules (optional)
# Add custom rules for specific artifacts.
# Example:
#   rules:
#     proposal:
#       - Keep proposals under 500 words
#       - Always state what is out of scope
#     tasks:
#       - Break tasks into chunks of max 2 hours

# Per-operation guidance (optional)
# Add advisory guidance for how apply and archive work should be conducted.
# This is separate from artifact rules above.
# Example:
#   operations:
#     apply:
#       guidance:
#         - Keep test summaries concise
#     archive:
#       guidance:
#         - Summarize the archive outcome before finishing
